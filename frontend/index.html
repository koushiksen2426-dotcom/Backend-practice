<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <nav>
    <div class="logo">
      Logo
    </div>
    <div class="account">
      <img class="account-img" src="download.png" alt="">
      <button class="logout-btn">Logout</button>
    </div>
  </nav>
   <div class="varifier">
      <!-- From Uiverse.io by alexruix -->
      <div class="form-box">
        <form class="form">
          <span class="title">Sign up</span>
          <span class="subtitle">Create a free account with your email.</span>
          <div class="form-container">
          <input type="text" class="input name" placeholder="Full Name">
          <input type="email" class="input email" placeholder="Email">
          <input type="password" class="input password" placeholder="Password">
          </div>
          <button type="submit" class="button">Sign up</button>
        </form>
        <div class="form-section">
          <p > <span class="account-statement">Have an account?</span> <a class="account-link" href="">Log in</a> </p>
        </div>
      </div>
   </div>


   <div class="show-item">
    
   </div>

</body>
  <script src="script.js"></script>
</html>
